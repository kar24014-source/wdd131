<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A review of Magyk, 
    the first Septimus Heap book by Angie Sage.">
    <title>Magyk | Kids Read for Fun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header" id="about">
            <h1 class="site-title">Kids Read For Fun</h1>
            <hr class="line">
            <nav class="nav" aria-label="Main navigation">
                <a class="navs" href="#about" aria-current="page">About</a>
                <a class="navs" href="#book-review">Archive</a>
                <a  class="navs" href="#book-review">Search</a>
            </nav>
            <hr class="line">
        </header>

        <main id="main-content">
            <article class="book-review" id="book-review" 
            aria-labelledby="book-title">
                <dl class="book-meta" aria-label="Book information">
                    <div>
                        <dt class="visually-hidden">Review date</dt>
                        <dd><time datetime="2022-07-05">July 5, 2022</time></dd>
                    </div>
                    <div>
                        <dt class="visually-hidden">Recommended age</dt>
                        <dd>10-14</dd>
                    </div>
                    <div>
                        <dt class="visually-hidden">Genre</dt>
                        <dd>Fantasy</dd>
                    </div>
                    <div>
                        <dt class="visually-hidden">Rating</dt>
                        <dd class="rating" aria-label="3 out of 4 stars">
                            <span class="span" aria-hidden="true">★★★★</span>
                        </dd>
                    </div>
                </dl>

                <h2 id="book-title">Septimus Heap Book one: Magyk</h2>

                <figure class="cover">
                    <img
                        src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg"
                        alt="Cover of Magyk by Angie Sage"
                        fetchpriority="high">
                </figure>

                <p class="review-copy">
                    If you enjoy stories about seventh sons of seventh sons and magyk this
                    is the book for you.
                </p>
            </article>
        </main>
        <hr class="line">
        <footer class="site-footer">
            <p class="name">Umaru Kargbo</p>
        </footer>
    </div>
</body>
</html>
